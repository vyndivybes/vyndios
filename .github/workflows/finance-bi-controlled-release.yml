name: Finance BI Controlled VYNDI Release
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/finance/financial-statements.ts'
      - 'src/lib/finance/financial-intelligence.ts'
      - 'src/routes/command/accounting-statements.tsx'
      - '.github/workflows/finance-bi-controlled-release.yml'
permissions:
  contents: read
concurrency:
  group: vyndios-controlled-worker-deploy
  cancel-in-progress: false
jobs:
  deploy-reviewed-main:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: e20ce7032f6475caaf1197b09d3fe164
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
      VITE_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Enforce exact reviewed SHA and existing deploy credential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKERS_CI_COMMIT_SHA"
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::VYNDI_DEPLOY_HOLD: GitHub Cloudflare deploy credential unavailable"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Re-run finance source qualifications
        run: node --experimental-strip-types --test src/lib/finance/financial-statements.test.ts src/lib/finance/financial-intelligence.test.ts
      - name: Verify current schema and build bundle (no runtime migration)
        run: npm run build:bundle
      - name: Reject stale main before deploying
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$WORKERS_CI_COMMIT_SHA"
      - name: Deploy to existing Worker preserving secrets
        run: npx --yes wrangler@4.136.3 deploy --config wrangler.jsonc
      - name: Confirm exact SHA, schema and database are healthy
        env:
          VYNDI_TEST_BASE_URL: https://vyndios.vayushastr.workers.dev
          VYNDI_TEST_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/production-deployment-readiness.mjs
