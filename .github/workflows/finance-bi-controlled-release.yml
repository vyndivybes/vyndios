name: Finance BI Production Verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/finance/financial-statements.ts'
      - 'src/lib/finance/financial-intelligence.ts'
      - 'src/routes/command/accounting-statements.tsx'
      - '.github/workflows/finance-bi-controlled-release.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/finance/financial-statements.ts'
      - 'src/lib/finance/financial-intelligence.ts'
      - 'src/routes/command/accounting-statements.tsx'
      - '.github/workflows/finance-bi-controlled-release.yml'
permissions:
  contents: read
concurrency:
  group: finance-bi-production-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualified-source-and-deployed-sha:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VYNDI_TEST_BASE_URL: https://vyndios.vayushastr.workers.dev
      VYNDI_TEST_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install reviewed dependency lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply reviewed picomatch mitigation for exact-lockfile build
        run: node scripts/security/picomatch-guard.mjs --apply
      - name: Verify source-governed financial accounting and BI regressions
        run: node --experimental-strip-types --test src/lib/finance/financial-statements.test.ts src/lib/finance/financial-intelligence.test.ts
      - name: Verify migration numbering and build bundle
        run: npm run build:bundle
      - name: Confirm independently deployed exact commit, schema and health
        if: github.event_name == 'push'
        run: node scripts/production-deployment-readiness.mjs
