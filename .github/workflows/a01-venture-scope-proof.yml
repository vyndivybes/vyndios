name: A01 Multi-Venture Read Boundary
on:
  pull_request:
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-single-venture-source-guard.ts'
      - 'scripts/vaos-a01-venture-scope-guard.test.mjs'
      - 'scripts/vaos-a01-venture-scope-postgres.test.mjs'
      - '.github/workflows/a01-venture-scope-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-single-venture-source-guard.ts'
      - 'scripts/vaos-a01-venture-scope-guard.test.mjs'
      - 'scripts/vaos-a01-venture-scope-postgres.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-cross-venture-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: a01_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: a01_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U a01_test -d a01_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: A01 unit, SQL contract, and real PostgreSQL cross-venture negative test
        env:
          A01_TEST_DATABASE_URL: postgres://a01_test:test_only@127.0.0.1:5432/a01_test
        run: node --experimental-strip-types --test scripts/vaos-a01-venture-scope-guard.test.mjs scripts/vaos-a01-venture-scope-postgres.test.mjs
