name: Picomatch controlled mitigation qualification

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - scripts/security/picomatch-guard.mjs
      - scripts/security/picomatch-guard.test.mjs
      - .github/workflows/picomatch-controlled-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mitigation-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply pinned local picomatch patch
        run: node scripts/security/picomatch-guard.mjs --apply
      - name: Prove malicious repeated extglobs are rejected
        run: node --test scripts/security/picomatch-guard.test.mjs
      - name: Qualify Cloudflare production bundle with enforced patch
        run: npm run build:bundle
      - name: Verify patched source remains in build toolchain
        run: node scripts/security/picomatch-guard.mjs --check
      - name: Require emitted Cloudflare Worker
        run: node --input-type=module -e "import { statSync } from 'node:fs'; if (!statSync('dist/server/index.js').isFile()) process.exit(1)"
