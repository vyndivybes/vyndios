name: One-shot Better Auth lockfile regeneration
on:
  push:
    branches:
      - fix/better-auth-cloudflare-upstream-20261119
    paths:
      - .github/workflows/auth-lockfile-bootstrap.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'vyndivybes/vyndios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate locked upstream auth dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          node -e "if (require('./package.json').dependencies['better-auth'] !== '1.7.26') process.exit(1)"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact better-auth@1.7.26
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/better-auth']?.version !== '1.7.26' || l.packages['node_modules/@better-auth/core']?.version !== '1.7.26') process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git rm -- .github/workflows/auth-lockfile-bootstrap.yml
          git commit -m "chore(auth): regenerate audited lockfile and remove one-shot bootstrap"
          git push origin HEAD:fix/better-auth-cloudflare-upstream-20261119
