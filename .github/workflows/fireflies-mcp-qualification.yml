name: Fireflies MCP qualification
on:
  push:
    branches: [integrations/fireflies-mcp-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fireflies-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types --test scripts/fireflies-meeting-evidence.test.mjs
