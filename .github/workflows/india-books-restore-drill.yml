name: VYNDI India Books Independent Restore Drill
on:
  workflow_dispatch:
    inputs:
      backup_key:
        description: Immutable S3 backup key from a verified daily backup run
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  isolated-restore:
    environment: finance-restore-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: temporary-restore-drill-only
          POSTGRES_DB: restored_books
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restored_books"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      AWS_REGION: ${{ vars.VYNDI_INDIA_BACKUP_AWS_REGION }}
      BACKUP_BUCKET: ${{ vars.VYNDI_INDIA_BACKUP_BUCKET }}
      BACKUP_KEY: ${{ inputs.backup_key }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate scope and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKUP_BUCKET"
          test -n "$BACKUP_KEY"
          case "$AWS_REGION" in ap-south-1|ap-south-2) ;; *) exit 1 ;; esac
          [[ "$BACKUP_KEY" =~ ^vyndios-books/daily/[0-9]{4}-[0-9]{2}-[0-9]{2}/books-[0-9]+-[0-9]+\.dump$ ]]
          test -n "${{ vars.VYNDI_INDIA_RESTORE_IAM_ROLE }}"
      - name: Authenticate distinct read-only restore reviewer via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.VYNDI_INDIA_RESTORE_IAM_ROLE }}
          aws-region: ${{ vars.VYNDI_INDIA_BACKUP_AWS_REGION }}
          role-session-name: vyndi-books-restore-${{ github.run_id }}
      - name: Read immutable India archive and verify downloaded SHA-256
        shell: bash
        run: |
          set -euo pipefail
          location="$(aws s3api get-bucket-location --bucket "$BACKUP_BUCKET" --query LocationConstraint --output text)"
          test "$location" = "$AWS_REGION"
          expected="$(aws s3api head-object --bucket "$BACKUP_BUCKET" --key "$BACKUP_KEY" --query 'Metadata.sha256' --output text)"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          install -d -m 0700 "$RUNNER_TEMP/vyndios-books-restore"
          aws s3 cp "s3://$BACKUP_BUCKET/$BACKUP_KEY" "$RUNNER_TEMP/vyndios-books-restore/books.dump"
          actual="$(sha256sum "$RUNNER_TEMP/vyndios-books-restore/books.dump" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          echo "ARCHIVE_DIGEST_VERIFIED"
      - name: Independently restore into disposable PostgreSQL 18 service
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e PGPASSWORD=temporary-restore-drill-only \
            -v "$RUNNER_TEMP/vyndios-books-restore:/work" \
            postgres:18-alpine sh -ec '
              pg_restore --exit-on-error --no-owner --no-acl \
                --dbname=postgresql://postgres:temporary-restore-drill-only@127.0.0.1:5432/restored_books \
                /work/books.dump
              psql --no-psqlrc --set ON_ERROR_STOP=on \
                --dbname=postgresql://postgres:temporary-restore-drill-only@127.0.0.1:5432/restored_books \
                -Atc "select count(*) from epr_finance_journals;"
              psql --no-psqlrc --set ON_ERROR_STOP=on \
                --dbname=postgresql://postgres:temporary-restore-drill-only@127.0.0.1:5432/restored_books \
                -Atc "select count(*) from vyndi_books_edit_audit;"
            '
      - name: Store non-sensitive restore outcome
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          writeFileSync(process.env.RUNNER_TEMP+"/vyndios-books-restore-proof.json",JSON.stringify({
            state:"INDEPENDENT_RESTORE_DRILL_PASSED",
            region:process.env.AWS_REGION,
            backupKey:process.env.BACKUP_KEY,
            restoredPostgresMajor:18, verifiedAt:new Date().toISOString(),
            githubRunId:process.env.GITHUB_RUN_ID,
            scope:"Database archive restore only; external voucher-file completeness separately verified"
          },null,2));
          NODE
      - name: Archive restore evidence only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: india-books-restore-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/vyndios-books-restore-proof.json
          retention-days: 30
      - name: Remove transient financial contents
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/vyndios-books-restore/books.dump"
          rmdir "$RUNNER_TEMP/vyndios-books-restore" 2>/dev/null || true
