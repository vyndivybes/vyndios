name: Development CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # This check is part of focused-validation, which is required by the main
      # ruleset; the separate path-filtered security workflow is not sufficient.
      - name: Least-privilege database restore and recovery objective evidence
        run: node --test scripts/backup-restore-governance.test.mjs

      - name: Isolated encrypted backup restore safety and completeness contract
        run: node --test scripts/isolated-backup-restore-qualification.test.mjs

      - name: Encrypted backup role authority fail-closed preflight
        run: node --test scripts/backup-authority-preflight.test.mjs

      - name: Full dependency security release gate
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=low

      - name: Auth credential-safe runtime diagnostic regression
        run: node --experimental-strip-types --test scripts/auth-credential-safe-diagnostics.test.mjs

      - name: Auth per-request PostgreSQL transport contract
        run: node --experimental-strip-types --test scripts/auth-request-time-transport.test.mjs

      - name: Cloudflare importable Hyperdrive auth transport regression
        run: node --test scripts/cloudflare-auth-hyperdrive-binding.test.mjs

      - name: SLO production login selector contract
        run: node --test scripts/slo-login-contract.test.mjs

      - name: Redacted PostgreSQL auth failure-stage diagnostic
        run: node --experimental-strip-types --test scripts/auth-db-stage-diagnostic.test.mjs

      - name: Database-authoritative SSR session contract
        run: node --test scripts/auth-db-authoritative-ssr.test.mjs

      - name: Reviewed upstream Better Auth Worker and SSR contract
        run: node --test scripts/auth-upstream-cloudflare-regression.test.mjs

      - name: Better Auth 1.7 compatibility
        run: npm run test:auth-1-7

      - name: Pre-production release presentation regression
        run: node --experimental-strip-types --test scripts/production-release-presentation.test.mjs

      - name: Four-order simulation HiGHS commissioning
        run: node --experimental-strip-types --test scripts/four-order-highs.test.mjs

      - name: Production exact-SHA fail-closed regression
        run: node --test scripts/production-deployment-readiness.test.mjs scripts/production-assurance-policy.test.mjs

      - name: Validate migrations
        run: npm run db:validate

      - name: Reconcile migration lineage
        run: npm run test:migration-lineage

      - name: VIBPE answer architecture
        run: npm run test:vibpe-answer-v3

      - name: VIBPE and Guided Work regressions
        run: node --test scripts/vibpe-copilot-2-intent.test.mjs scripts/vibpe-operational-status-intent.test.mjs scripts/vibpe-operational-control-guard.test.mjs scripts/guided-work-mode.test.mjs

      - name: VIBPE optimizer source and run lineage regression
        run: node --experimental-strip-types --test src/lib/vibpe-optimizer-release-policy.test.ts

      - name: Enterprise authority closure
        run: npm run test:authority-closure

      - name: Execute migrations from empty database
        run: node --test scripts/migration-execution.test.mjs

      - name: CA signed certificate SQL integrity
        run: node --test scripts/ca-certificate-db.test.mjs

      - name: People and Office lifecycle authority
        run: npm run test:people-office-lifecycle

      - name: Expanded H2 recovery qualification
        run: npm run test:h2:recovery:expanded

      - name: Cancelled-job-card traveller stage fail-closed isolation
        run: node --test scripts/cancelled-parent-traveller-guard.test.mjs

      - name: Recovery append-only event ID uniqueness
        run: node --test scripts/recovery-event-id-uniqueness.test.mjs

      - name: Funding lifecycle authority
        run: npm run test:funding-lifecycle

      - name: Writer and route consolidation
        run: npm run test:writer-route-consolidation

      - name: Hyperdrive runtime reconciliation
        run: npm run test:runtime-hyperdrive

      - name: Golden MES qualification
        run: npm run test:mes:golden

      - name: H4 IAM / SoD qualification
        run: npm run test:h4:iam

      - name: Universal scanner input
        run: npm run test:scanner

      - name: VAOS operational write authority
        run: npm run test:vaos-write-authority

      - name: A01 cross-venture source isolation unit and signed read contract
        run: node --experimental-strip-types --test scripts/vaos-a01-venture-scope-guard.test.mjs

      - name: A01 venture-keyed inventory shadow and negative authorization tests
        run: node --test scripts/vaos-venture-inventory-shadow-contract.test.mjs scripts/vaos-venture-inventory-shadow-postgres.test.mjs

      - name: VAOS signed read bridge
        run: npm run test:vaos-bridge:read

      - name: Founder enterprise BI authority and period tests
        run: node --experimental-strip-types --test src/lib/vaos-enterprise-bi-read.test.ts scripts/vaos-enterprise-bi.integration.test.mjs

      - name: Enterprise assurance control regression
        run: npm run test:assurance:closure

      - name: Complete canonical regression suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare production bundle
        run: npm run build:bundle

