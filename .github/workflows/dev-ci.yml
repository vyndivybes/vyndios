name: Development CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Production exact-SHA fail-closed regression
        run: node --test scripts/production-deployment-readiness.test.mjs scripts/production-assurance-policy.test.mjs

      - name: Validate migrations
        run: npm run db:validate

      - name: Reconcile migration lineage
        run: npm run test:migration-lineage

      - name: VIBPE answer architecture
        run: npm run test:vibpe-answer-v3

      - name: VIBPE and Guided Work regressions
        run: node --test scripts/vibpe-copilot-2-intent.test.mjs scripts/vibpe-operational-status-intent.test.mjs scripts/vibpe-operational-control-guard.test.mjs scripts/guided-work-mode.test.mjs

      - name: VIBPE optimizer source and run lineage regression
        run: node --experimental-strip-types --test src/lib/vibpe-optimizer-release-policy.test.ts

      - name: Enterprise authority closure
        run: npm run test:authority-closure

      - name: Execute migrations from empty database
        run: node --test scripts/migration-execution.test.mjs

      - name: People and Office lifecycle authority
        run: npm run test:people-office-lifecycle

      - name: Expanded H2 recovery qualification
        run: npm run test:h2:recovery:expanded

      - name: Funding lifecycle authority
        run: npm run test:funding-lifecycle

      - name: Writer and route consolidation
        run: npm run test:writer-route-consolidation

      - name: Hyperdrive runtime reconciliation
        run: npm run test:runtime-hyperdrive

      - name: Golden MES qualification
        run: npm run test:mes:golden

      - name: H4 IAM / SoD qualification
        run: npm run test:h4:iam

      - name: Universal scanner input
        run: npm run test:scanner

      - name: VAOS operational write authority
        run: npm run test:vaos-write-authority

      - name: VAOS signed read bridge
        run: npm run test:vaos-bridge:read

      - name: Enterprise assurance control regression
        run: npm run test:assurance:closure

      - name: Complete canonical regression suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Cloudflare production bundle
        run: npm run build:bundle

