name: CI

# Canonical repository CI. Cloudflare is the production deployment authority.
# This workflow runs for every main-bound PR and again after changes land on
# main, so direct pushes cannot remain unobserved even where plan-level branch
# protection is unavailable.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authentication invariant gate
        run: npm run check:auth -- --ci

      - name: Route invariant gate
        run: npm run check:routes

      - name: Login warp transition gate
        run: node --test scripts/login-warp-transition.test.mjs

      - name: Actuals evidence regression gate
        run: node --experimental-strip-types --test scripts/actuals-evidence-regression.test.mjs

      - name: Startup cash authority regression gate
        run: node --test scripts/startup-cash-authority-regression.test.mjs

      - name: Migration environment isolation gate
        run: node --test scripts/migration-environment.test.mjs

      - name: Session security policy gate
        run: node --experimental-strip-types --test scripts/session-security-policy.test.mjs

      - name: Concurrent session cap gate
        run: node --experimental-strip-types --test scripts/session-concurrency.test.mjs

      - name: Security boundary regression gate
        run: node --experimental-strip-types --test scripts/security-boundary-regression.test.mjs

      - name: EPR individual mutation authority gate
        run: node --test scripts/epr-individual-authority.test.mjs

      - name: Deployment target regression gate
        run: node --test scripts/deployment-target-regression.test.mjs

      - name: Single-provider production gate
        run: npm run check:single-provider


      - name: Production Cloudflare bundle gate
        run: npm run build:bundle

      - name: Generate route tree and typecheck
        run: npm run typecheck


      - name: Client bundle invariant gate
        run: node scripts/check-client-bundle.mjs

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Measurable coverage gate
        run: npm run test:coverage
