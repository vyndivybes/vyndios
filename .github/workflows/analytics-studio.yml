name: Analytics Studio Verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/analytics-studio.ts'
      - 'src/lib/analytics-studio.test.ts'
      - 'src/routes/command/analytics-studio.tsx'
      - 'src/lib/page-metadata.ts'
      - 'src/lib/operating-workflow.ts'
      - '.github/workflows/analytics-studio.yml'
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused evidence/aggregation tests
        run: node --experimental-strip-types --test src/lib/analytics-studio.test.ts
      - name: Generate route tree and bundle VYNDI app
        run: npm run build:dev
      - name: Typecheck generated enterprise analytics route
        run: npx tsc --noEmit
