name: Finance Accounting and CA Evidence Qualification
on:
  pull_request:
    paths:
      - 'src/lib/finance/tally-*'
      - 'src/lib/finance/ca-*'
      - 'src/routes/command/ca-certificate-register.tsx'
      - 'migrations/0194_ca_certificate_evidence_register.sql'
      - 'scripts/tally-*'
      - 'scripts/ca-*'
      - '.github/workflows/finance-f1-qualification.yml'
  workflow_dispatch:
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused offline accounting qualification tests
        run: |
          node --experimental-strip-types --test \
            scripts/tally-trial-balance-reconciliation.test.mjs \
            scripts/tally-ca-actual-statements.test.mjs \
            scripts/tally-import.test.mjs \
            scripts/tally-native-xml-export.test.mjs \
            scripts/tally-native-xml-response.test.mjs \
            scripts/tally-voucher-reconciliation.test.mjs \
            scripts/tally-gst-reconciliation.test.mjs \
            scripts/ca-reconciliation-dashboard.test.mjs \
            scripts/ca-evidence-manifest.test.mjs \
            scripts/ca-evidence-hashing.test.mjs \
            scripts/ca-qualification-pipeline.test.mjs \
            scripts/ca-certificate-controls.test.mjs \
            scripts/ca-certificate-register-contract.test.mjs \
            scripts/ca-certificate-migration-shape.test.mjs
