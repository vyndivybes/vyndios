name: Founder OIDC package-lock reconciliation (isolated branch)

on:
  push:
    branches:
      - security/official-better-auth-oidc-provider-20261120
    paths:
      - package.json
      - .github/workflows/oidc-provider-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: oidc-provider-lock-sync
  cancel-in-progress: true

jobs:
  synchronize-reviewed-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout scoped feature branch
        uses: actions/checkout@v4
        with:
          ref: security/official-better-auth-oidc-provider-20261120
          persist-credentials: true

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate exact matching npm lockfile without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact @better-auth/oauth-provider@1.7.26 --no-fund
          node -e "const p=require('./package-lock.json');if(p.packages[''].dependencies['@better-auth/oauth-provider']!=='1.7.26'||p.packages['node_modules/@better-auth/oauth-provider']?.version!=='1.7.26')process.exit(19)"

      - name: Commit only the audited manifest and lockfile
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "OAuth dependency lock already current."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(sso): lock Better Auth 1.7.26 OAuth Provider dependency'
          git push origin HEAD:security/official-better-auth-oidc-provider-20261120
