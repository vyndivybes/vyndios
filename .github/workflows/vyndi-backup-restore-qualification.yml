name: VYNDI Encrypted Backup Isolated Restore Qualification
on:
  workflow_dispatch:
    inputs:
      backup_date_ist:
        description: Backup date in IST (YYYY-MM-DD)
        type: string
        required: true
        default: '2026-11-19'
      backup_run_id:
        description: Original successful encrypted backup workflow run ID
        type: string
        required: true
        default: '44440922580'
      backup_attempt:
        description: Original successful run attempt
        type: string
        required: true
        default: '2'
permissions:
  contents: read
concurrency:
  group: vyndi-supplemental-backup-restore-qualification
  cancel-in-progress: false
jobs:
  isolated-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: finance-backup
    env:
      AGE_IDENTITY: ${{ secrets.VYNDI_GOOGLE_BACKUP_AGE_IDENTITY }}
      VYNDI_GOOGLE_BACKUP_AGE_RECIPIENT: ${{ vars.VYNDI_GOOGLE_BACKUP_AGE_RECIPIENT }}
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ vars.VYNDI_GOOGLE_BACKUP_FOLDER_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.VYNDI_GDRIVE_CLIENT_ID }}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.VYNDI_GDRIVE_CLIENT_SECRET }}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.VYNDI_GDRIVE_OAUTH_TOKEN }}
      BACKUP_DATE_IST: ${{ inputs.backup_date_ist }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      BACKUP_ATTEMPT: ${{ inputs.backup_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Install decryption and read-only remote tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y age rclone
      - name: Decrypt directly into isolated PostgreSQL and compare complete manifest
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$BACKUP_DATE_IST" =~ ^20[0-9]{2}-[01][0-9]-[0-3][0-9]$ ]]
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]{8,15}$ ]]
          [[ "$BACKUP_ATTEMPT" =~ ^[1-9][0-9]?$ ]]
          test -n "$AGE_IDENTITY"
          test -n "$VYNDI_GOOGLE_BACKUP_AGE_RECIPIENT"
          test -n "$RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID"
          test -n "$RCLONE_CONFIG_GDRIVE_TOKEN"
          identity_file="$RUNNER_TEMP/vyndi-restore.agekey"
          cid=""
          cleanup() {
            rm -f "$identity_file"
            if [[ -n "$cid" ]]; then docker stop "$cid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          printf '%s\n' "$AGE_IDENTITY" > "$identity_file"
          chmod 600 "$identity_file"
          derived_recipient="$(age-keygen -y "$identity_file")"
          test "$derived_recipient" = "$VYNDI_GOOGLE_BACKUP_AGE_RECIPIENT"
          remote="gdrive:daily/$BACKUP_DATE_IST/books-$BACKUP_RUN_ID-$BACKUP_ATTEMPT.dump.age"
          # The only database is a network-isolated, disposable Docker container.
          cid="$(docker run -d --rm --network none -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vyndi_restore postgres:18-alpine)"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u postgres "$cid" pg_isready --dbname=vyndi_restore >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" -eq 1
          # Measure the isolated data-recovery segment only; this is not whole-app RTO.
          restore_start_epoch="$(date +%s)"
          # No plaintext archive is written to disk or uploaded as a CI artifact.
          rclone cat "$remote" | age --decrypt -i "$identity_file" | docker exec -i -u postgres "$cid" pg_restore --single-transaction --exit-on-error --no-owner --no-acl --dbname=vyndi_restore --format=custom
          manifest="$(docker exec -u postgres "$cid" psql --no-psqlrc --no-align --tuples-only --dbname=vyndi_restore --command="SELECT md5(string_agg(format('%I.%I',n.nspname,c.relname), E'\\n' ORDER BY n.nspname,c.relname)) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','p') AND n.nspname NOT IN ('pg_catalog','information_schema') AND n.nspname NOT LIKE 'pg_toast%';")"
          test "$manifest" = 'eb2ba0c89dd4209992a6080c222759ac'
          private_rows="$(docker exec -u postgres "$cid" psql --no-psqlrc --no-align --tuples-only --dbname=vyndi_restore --command='SELECT COUNT(*) FROM vyndi_private.bi_dashboards;')"
          test "$private_rows" = '1'
          # Positive and negative readback by an independent least-privilege
          # identity in the disposable container. No production role is altered.
          docker exec -i -u postgres "$cid" psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname=vyndi_restore < scripts/backup-restore-least-privilege.sql
          measured_restore_seconds="$(($(date +%s) - restore_start_epoch))"
          {
            echo '## VYNDI isolated encrypted backup restore qualification PASS'
            echo 'Origin: supplementary encrypted Google Drive PostgreSQL backup'
            echo "Backup reference: $BACKUP_RUN_ID attempt $BACKUP_ATTEMPT ($BACKUP_DATE_IST IST)"
            echo 'Destination: network-isolated ephemeral PostgreSQL 18 (no production connection)'
            echo 'Manifest and protected private-BI table row count match the approved snapshot baseline'
            echo 'Plaintext archive: streamed only; no persistent backup file or artifact'
            echo "Measured isolated database recovery segment: ${measured_restore_seconds} seconds (not whole-app RTO)"
            echo 'Recovery-point and whole-application RTO/RPO objectives remain unverified separately'
            echo 'Least-privilege restored-data readback (positive and negative) PASS'
          } >> "$GITHUB_STEP_SUMMARY"
