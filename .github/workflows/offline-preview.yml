name: No-Cloudflare VYNDI OS preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build preview without deploying
        run: npm run build:dev
      - uses: actions/upload-artifact@v4
        with:
          name: vyndios-browser-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
