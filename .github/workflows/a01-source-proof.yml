name: A01 Signed-Source and Direct-Witness Contract
on:
  pull_request:
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-ontology-read-receipt.ts'
      - 'scripts/vaos-a01-external-count-witness.sql'
      - 'scripts/vaos-ontology-source-receipt.test.mjs'
      - 'scripts/vaos-read-bridge-contract.test.mjs'
      - 'migrations/0196_vaos_source_revision_witness.sql'
      - 'scripts/vaos-source-revision-witness.test.mjs'
      - 'scripts/vaos-source-revision-postgres.test.mjs'
      - 'migrations/0197_vaos_venture_isolated_inventory_candidate.sql'
      - 'scripts/vaos-venture-isolated-inventory-postgres.test.mjs'
      - '.github/workflows/a01-source-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-ontology-read-receipt.ts'
      - 'scripts/vaos-a01-external-count-witness.sql'
      - 'scripts/vaos-ontology-source-receipt.test.mjs'
      - 'scripts/vaos-read-bridge-contract.test.mjs'
      - 'migrations/0196_vaos_source_revision_witness.sql'
      - 'scripts/vaos-source-revision-witness.test.mjs'
      - 'scripts/vaos-source-revision-postgres.test.mjs'
      - 'migrations/0197_vaos_venture_isolated_inventory_candidate.sql'
      - 'scripts/vaos-venture-isolated-inventory-postgres.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PGlite fixture dependency (no scripts, no credentials)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Signed source, source-revision and direct-witness tests (isolated PGlite only)
        run: node --experimental-strip-types --test scripts/vaos-ontology-source-receipt.test.mjs scripts/vaos-read-bridge-contract.test.mjs scripts/vaos-source-revision-witness.test.mjs

  postgres-multisession:
    name: PostgreSQL 18 concurrent writer source-revision witness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Disposable, test-only database; never touches Neon or production.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: a01_test
          POSTGRES_PASSWORD: a01_fixture_only
          POSTGRES_DB: a01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a01_test -d a01_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline-fixture code dependencies, without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify concurrent commit order, rollback, lock timeout, RLS and snapshot
        run: node --test scripts/vaos-source-revision-postgres.test.mjs
        env:
          A01_TEST_DATABASE_URL: postgres://a01_test:a01_fixture_only@127.0.0.1:5432/a01_test

  postgres-venture-isolation:
    name: PostgreSQL 18 two-venture quantity/cost isolation and private ACL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Zero-business-data, fresh test database, independently scoped per job.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: a01_test
          POSTGRES_PASSWORD: a01_fixture_only
          POSTGRES_DB: a01_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U a01_test -d a01_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated fixture dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove same-SKU different-venture physical and cost separation
        run: node --test scripts/vaos-venture-isolated-inventory-postgres.test.mjs
        env:
          A01_TEST_DATABASE_URL: postgres://a01_test:a01_fixture_only@127.0.0.1:5432/a01_test
