name: A01 Signed-Source and Direct-Witness Contract
on:
  pull_request:
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-ontology-read-receipt.ts'
      - 'scripts/vaos-a01-external-count-witness.sql'
      - 'scripts/vaos-ontology-source-receipt.test.mjs'
      - 'scripts/vaos-read-bridge-contract.test.mjs'
      - '.github/workflows/a01-source-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-ontology-read-receipt.ts'
      - 'scripts/vaos-a01-external-count-witness.sql'
      - 'scripts/vaos-ontology-source-receipt.test.mjs'
      - 'scripts/vaos-read-bridge-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Signed source, canonical PO status, and direct witness tests (no secrets or DB)
        run: node --experimental-strip-types --test scripts/vaos-ontology-source-receipt.test.mjs scripts/vaos-read-bridge-contract.test.mjs
