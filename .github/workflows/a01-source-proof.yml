name: A01 Signed-Source and Direct-Witness Contract
on:
  pull_request:
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-ontology-read-receipt.ts'
      - 'scripts/vaos-a01-external-count-witness.sql'
      - 'scripts/vaos-ontology-source-receipt.test.mjs'
      - 'scripts/vaos-read-bridge-contract.test.mjs'
      - 'migrations/0196_vaos_source_revision_witness.sql'
      - 'scripts/vaos-source-revision-witness.test.mjs'
      - '.github/workflows/a01-source-proof.yml'
  push:
    branches: [main]
    paths:
      - 'src/routes/api/vaos/bridge.ts'
      - 'src/lib/vaos-ontology-read-receipt.ts'
      - 'scripts/vaos-a01-external-count-witness.sql'
      - 'scripts/vaos-ontology-source-receipt.test.mjs'
      - 'scripts/vaos-read-bridge-contract.test.mjs'
      - 'migrations/0196_vaos_source_revision_witness.sql'
      - 'scripts/vaos-source-revision-witness.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PGlite fixture dependency (no scripts, no credentials)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Signed source, source-revision and direct-witness tests (isolated PGlite only)
        run: node --experimental-strip-types --test scripts/vaos-ontology-source-receipt.test.mjs scripts/vaos-read-bridge-contract.test.mjs scripts/vaos-source-revision-witness.test.mjs
