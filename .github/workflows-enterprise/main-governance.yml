name: Main Governance Tripwire

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-pr-lineage:
    runs-on: [self-hosted, Linux, X64, vyndi-linux]
    steps:
      - name: Require merged pull-request lineage for main
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              },
            );
            const merged = pulls.filter((pr) => pr.merged_at);
            if (merged.length < 1) {
              core.setFailed(`main commit ${context.sha} has no merged pull-request lineage. Enable repository branch protection/rulesets to prevent recurrence.`);
            } else {
              core.info(`main commit ${context.sha} is linked to ${merged.length} merged pull request(s).`);
            }
