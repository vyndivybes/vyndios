name: Self-hosted Windows Qualification

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/self-hosted-windows-qualification.yml"
      - "scripts/vyndi-zero-cost-backup.ps1"
      - "scripts/vyndi-zero-cost-restore.ps1"
      - "scripts/run-vyndi-release-test.ps1"
      - "scripts/deployment-target-regression.test.mjs"

jobs:
  qualify-runner:
    runs-on: [self-hosted, Windows, X64, vyndi-windows]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner toolchain
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          node --version
          npm.cmd --version
          git --version

      - name: Install dependencies
        shell: powershell
        run: npm.cmd ci

      - name: Release browser setup contract
        shell: powershell
        run: node --test scripts/deployment-target-regression.test.mjs

      - name: Bounded Chromium launch preflight
        shell: powershell
        timeout-minutes: 4
        run: .\scripts\run-vyndi-release-test.ps1 -SetupOnly -NonInteractive -SetupTimeoutSeconds 180

      - name: Parse zero-cost PowerShell recovery helpers
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/vyndi-zero-cost-backup.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/vyndi-zero-cost-restore.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; exit 1 }

      - name: Database syntax validation
        shell: powershell
        run: npm.cmd run db:validate

      - name: Department identity regression
        shell: powershell
        run: npm.cmd run test:departments:identity
